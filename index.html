<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frases Motivacionales</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #111111;
      --text-primary: #f5f5f5;
      --text-secondary: #888888;
      --accent: #e0e0e0;
      --accent-glow: rgba(255, 255, 255, 0.08);
      --mood-normal: #3b82f6;
      --mood-bad: #ef4444;
      --mood-fire: #f59e0b;
      --mood-real: #8b5cf6;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 0.6s ease;
    }

    body.mood-bad {
      background: linear-gradient(135deg, #0a0a0a 0%, #2a0a0a 100%);
    }

    body.mood-fire {
      background: linear-gradient(135deg, #0a0a0a 0%, #2a1a0a 100%);
    }

    body.mood-real {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2a 100%);
    }

    /* Animated background orbs with blur */
    .bg-orbs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      animation: orbFloat 20s ease-in-out infinite;
      transition: background 0.6s ease;
    }

    .orb:nth-child(1) {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #ffffff 0%, transparent 70%);
      top: -10%;
      left: -10%;
      animation-delay: 0s;
      animation-duration: 25s;
    }

    body.mood-bad .orb:nth-child(1) {
      background: radial-gradient(circle, #ff4444 0%, transparent 70%);
    }

    body.mood-fire .orb:nth-child(1) {
      background: radial-gradient(circle, #ff9900 0%, transparent 70%);
    }

    body.mood-real .orb:nth-child(1) {
      background: radial-gradient(circle, #9966ff 0%, transparent 70%);
    }

    .orb:nth-child(2) {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #cccccc 0%, transparent 70%);
      bottom: -15%;
      right: -5%;
      animation-delay: -5s;
      animation-duration: 22s;
    }

    body.mood-bad .orb:nth-child(2) {
      background: radial-gradient(circle, #ff6666 0%, transparent 70%);
    }

    body.mood-fire .orb:nth-child(2) {
      background: radial-gradient(circle, #ffaa22 0%, transparent 70%);
    }

    body.mood-real .orb:nth-child(2) {
      background: radial-gradient(circle, #bb88ff 0%, transparent 70%);
    }

    .orb:nth-child(3) {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #aaaaaa 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -10s;
      animation-duration: 18s;
    }

    body.mood-bad .orb:nth-child(3) {
      background: radial-gradient(circle, #ff7777 0%, transparent 70%);
    }

    body.mood-fire .orb:nth-child(3) {
      background: radial-gradient(circle, #ffbb33 0%, transparent 70%);
    }

    body.mood-real .orb:nth-child(3) {
      background: radial-gradient(circle, #cc99ff 0%, transparent 70%);
    }

    @keyframes orbFloat {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      25% {
        transform: translate(80px, -60px) scale(1.1);
      }
      50% {
        transform: translate(-40px, 40px) scale(0.9);
      }
      75% {
        transform: translate(60px, 80px) scale(1.05);
      }
    }

    /* Noise texture overlay */
    .noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves=[...]
      background-repeat: repeat;
      background-size: 256px 256px;
    }

    /* Main container */
    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 800px;
      padding: 2rem;
      width: 100%;
    }

    /* Header */
    .header {
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeInUp 1s ease-out 0.2s forwards;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 0.3rem;
      transition: color 0.6s ease;
    }

    body.mood-bad .header h1 {
      color: #ff4444;
    }

    body.mood-fire .header h1 {
      color: #ff9900;
    }

    body.mood-real .header h1 {
      color: #9966ff;
    }

    .header .line {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--text-secondary), transparent);
      margin: 0 auto;
      transition: background 0.6s ease;
    }

    body.mood-bad .header .line {
      background: linear-gradient(90deg, transparent, #ff4444, transparent);
    }

    body.mood-fire .header .line {
      background: linear-gradient(90deg, transparent, #ff9900, transparent);
    }

    body.mood-real .header .line {
      background: linear-gradient(90deg, transparent, #9966ff, transparent);
    }

    /* Quote card */
    .quote-card {
      position: relative;
      padding: 3rem 2.5rem;
      margin-bottom: 2.5rem;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    body.mood-bad .quote-card {
      border-color: rgba(255, 68, 68, 0.15);
      background: rgba(255, 68, 68, 0.02);
    }

    body.mood-fire .quote-card {
      border-color: rgba(255, 153, 0, 0.15);
      background: rgba(255, 153, 0, 0.02);
    }

    body.mood-real .quote-card {
      border-color: rgba(153, 102, 255, 0.15);
      background: rgba(153, 102, 255, 0.02);
    }

    .quote-card:hover {
      border-color: rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
    }

    body.mood-bad .quote-card:hover {
      border-color: rgba(255, 68, 68, 0.3);
      background: rgba(255, 68, 68, 0.05);
    }

    body.mood-fire .quote-card:hover {
      border-color: rgba(255, 153, 0, 0.3);
      background: rgba(255, 153, 0, 0.05);
    }

    body.mood-real .quote-card:hover {
      border-color: rgba(153, 102, 255, 0.3);
      background: rgba(153, 102, 255, 0.05);
    }

    .quote-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 25px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%, rgba(255,255,255,0.05) 100%);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: xor;
      -webkit-mask-composite: xor;
      pointer-events: none;
    }

    /* Quote marks */
    .quote-mark {
      font-family: 'Playfair Display', serif;
      font-size: 5rem;
      line-height: 1;
      color: rgba(255, 255, 255, 0.06);
      position: absolute;
      top: 10px;
      left: 25px;
      user-select: none;
      transition: color 0.6s ease;
    }

    body.mood-bad .quote-mark {
      color: rgba(255, 68, 68, 0.15);
    }

    body.mood-fire .quote-mark {
      color: rgba(255, 153, 0, 0.15);
    }

    body.mood-real .quote-mark {
      color: rgba(153, 102, 255, 0.15);
    }

    /* Quote text */
    .quote-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 400;
      line-height: 1.6;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
      transition: opacity 0.5s ease, transform 0.5s ease, filter 0.5s ease;
    }

    .quote-text.blur-out {
      opacity: 0;
      transform: translateY(-20px);
      filter: blur(12px);
    }

    .quote-text.blur-in {
      opacity: 0;
      transform: translateY(20px);
      filter: blur(12px);
    }

    /* Author */
    .quote-author {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
      transition: opacity 0.5s ease, transform 0.5s ease, filter 0.5s ease;
      transition-delay: 0.05s;
    }

    .quote-author.blur-out {
      opacity: 0;
      transform: translateY(-10px);
      filter: blur(8px);
    }

    .quote-author.blur-in {
      opacity: 0;
      transform: translateY(10px);
      filter: blur(8px);
    }

    .author-dash {
      display: inline-block;
      width: 20px;
      height: 1px;
      background: var(--text-secondary);
      vertical-align: middle;
      margin-right: 10px;
      opacity: 0.5;
    }

    /* Button */
    .btn-generate {
      position: relative;
      padding: 14px 40px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-primary);
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 60px;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      animation: fadeInUp 1s ease-out 0.6s forwards;
    }

    body.mood-bad .btn-generate {
      border-color: rgba(255, 68, 68, 0.3);
    }

    body.mood-fire .btn-generate {
      border-color: rgba(255, 153, 0, 0.3);
    }

    body.mood-real .btn-generate {
      border-color: rgba(153, 102, 255, 0.3);
    }

    .btn-generate::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
    }

    body.mood-bad .btn-generate::before {
      background: rgba(255, 68, 68, 0.1);
    }

    body.mood-fire .btn-generate::before {
      background: rgba(255, 153, 0, 0.1);
    }

    body.mood-real .btn-generate::before {
      background: rgba(153, 102, 255, 0.1);
    }

    .btn-generate:hover {
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
    }

    body.mood-bad .btn-generate:hover {
      border-color: rgba(255, 68, 68, 0.5);
      box-shadow: 0 0 30px rgba(255, 68, 68, 0.1);
    }

    body.mood-fire .btn-generate:hover {
      border-color: rgba(255, 153, 0, 0.5);
      box-shadow: 0 0 30px rgba(255, 153, 0, 0.1);
    }

    body.mood-real .btn-generate:hover {
      border-color: rgba(153, 102, 255, 0.5);
      box-shadow: 0 0 30px rgba(153, 102, 255, 0.1);
    }

    .btn-generate:hover::before {
      width: 300px;
      height: 300px;
    }

    .btn-generate:active {
      transform: scale(0.97);
    }

    .btn-generate span {
      position: relative;
      z-index: 1;
    }

    /* Counter */
    .counter {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      opacity: 0.4;
      letter-spacing: 0.08em;
      transition: opacity 0.3s ease;
    }

    /* Keyboard hint */
    .hint {
      margin-top: 0.8rem;
      font-size: 0.7rem;
      color: var(--text-secondary);
      opacity: 0;
      animation: fadeInUp 1s ease-out 1s forwards;
      letter-spacing: 0.05em;
    }

    .hint kbd {
      display: inline-block;
      padding: 2px 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.03);
      margin: 0 2px;
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
        filter: blur(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    /* Initial load animation for quote card */
    .quote-card {
      opacity: 0;
      animation: fadeInUp 1s ease-out 0.4s forwards;
    }

    /* Ripple effect on button click */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      transform: scale(0);
      animation: rippleEffect 0.8s ease-out forwards;
      pointer-events: none;
    }

    body.mood-bad .ripple {
      background: rgba(255, 68, 68, 0.3);
    }

    body.mood-fire .ripple {
      background: rgba(255, 153, 0, 0.3);
    }

    body.mood-real .ripple {
      background: rgba(153, 102, 255, 0.3);
    }

    @keyframes rippleEffect {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    /* Particle burst */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      filter: blur(1px);
      animation: particleFade 1.2s ease-out forwards;
    }

    body.mood-bad .particle {
      background: rgba(255, 68, 68, 0.6);
    }

    body.mood-fire .particle {
      background: rgba(255, 153, 0, 0.6);
    }

    body.mood-real .particle {
      background: rgba(153, 102, 255, 0.6);
    }

    @keyframes particleFade {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0);
      }
    }

    /* Smooth scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    /* Share tooltip */
    .share-btn {
      position: absolute;
      bottom: 15px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      opacity: 0;
      transition: opacity 0.3s ease, color 0.3s ease;
      padding: 5px 10px;
    }

    .quote-card:hover .share-btn {
      opacity: 0.5;
    }

    .share-btn:hover {
      opacity: 1 !important;
      color: var(--text-primary);
    }

    .copied-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 0.8rem;
      color: var(--text-primary);
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 100;
      pointer-events: none;
    }

    .copied-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Category pills */
    .categories {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeInUp 1s ease-out 0.3s forwards;
    }

    .category-pill {
      padding: 6px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .category-pill:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
    }

    .category-pill.active {
      border-color: rgba(255, 255, 255, 0.25);
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.08);
    }

    /* Mood selector */
    .mood-selector {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeInUp 1s ease-out 0.1s forwards;
    }

    .mood-btn {
      padding: 8px 18px;
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      font-weight: 500;
    }

    .mood-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .mood-btn.active {
      transform: scale(1.05);
    }

    .mood-btn.mood-normal {
      border-color: var(--mood-normal);
      color: var(--mood-normal);
    }

    .mood-btn.mood-normal.active {
      background: rgba(59, 130, 246, 0.15);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
    }

    .mood-btn.mood-bad {
      border-color: var(--mood-bad);
      color: var(--mood-bad);
    }

    .mood-btn.mood-bad.active {
      background: rgba(239, 68, 68, 0.15);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
    }

    .mood-btn.mood-fire {
      border-color: var(--mood-fire);
      color: var(--mood-fire);
    }

    .mood-btn.mood-fire.active {
      background: rgba(245, 158, 11, 0.15);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
    }

    .mood-btn.mood-real {
      border-color: var(--mood-real);
      color: var(--mood-real);
    }

    .mood-btn.mood-real.active {
      background: rgba(139, 92, 246, 0.15);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 1.5rem;
      }
      .quote-card {
        padding: 2rem 1.5rem;
        min-height: 180px;
      }
      .quote-mark {
        font-size: 3.5rem;
        top: 5px;
        left: 15px;
      }
      .mood-selector {
        gap: 6px;
      }
      .mood-btn {
        padding: 6px 12px;
        font-size: 0.6rem;
      }
    }
  </style>
</head>
<body>

  <!-- Background effects -->
  <div class="bg-orbs">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>
  <div class="noise"></div>
  <div class="particles" id="particles"></div>

  <!-- Main content -->
  <div class="container">
    <div class="header">
      <h1>Frases Motivacionales</h1>
      <div class="line"></div>
    </div>

    <!-- Mood selector -->
    <div class="mood-selector">
      <button class="mood-btn mood-normal active" data-mood="normal">Normal</button>
      <button class="mood-btn mood-bad" data-mood="bad">Mood Malo</button>
      <button class="mood-btn mood-fire" data-mood="fire">Gym 💪</button>
      <button class="mood-btn mood-real" data-mood="real">Cruda Realidad</button>
    </div>

    <!-- Category filters -->
    <div class="categories">
      <button class="category-pill active" data-category="all">Todas</button>
      <button class="category-pill" data-category="vida">Vida</button>
      <button class="category-pill" data-category="exito">Exito</button>
      <button class="category-pill" data-category="fuerza">Fuerza</button>
      <button class="category-pill" data-category="sabiduria">Sabiduria</button>
      <button class="category-pill" data-category="creatividad">Creatividad</button>
      <button class="category-pill" data-category="personal">Personal</button>
      <button class="category-pill" data-category="gym">Gym</button>
      <button class="category-pill" data-category="realidad">Realidad</button>
    </div>

    <!-- Quote display -->
    <div class="quote-card" id="quoteCard">
      <span class="quote-mark">&ldquo;</span>
      <p class="quote-text" id="quoteText">El unico modo de hacer un gran trabajo es amar lo que haces.</p>

        { text: "A veces la gente es una mierda, y eso esta bien. El problema es seguir esperando lo contrario.", author: "Anónimo", category: "realidad" },

    // State
    let currentMood = 'normal';
    let currentCategory = 'all';
    let currentIndex = 0;
    let quoteCount = 0;
    let isAnimating = false;
    let lastQuoteIndex = -1;

    // DOM elements
    const quoteText = document.getElementById('quoteText');
    const quoteAuthor = document.getElementById('quoteAuthor');
    const generateBtn = document.getElementById('generateBtn');
    const counter = document.getElementById('counter');
    const shareBtn = document.getElementById('shareBtn');
    const toast = document.getElementById('toast');
    const particlesContainer = document.getElementById('particles');
    const categoryPills = document.querySelectorAll('.category-pill');
    const moodBtns = document.querySelectorAll('.mood-btn');

    // Get filtered quotes
    function getFilteredQuotes() {
      const quotes = quotesByMood[currentMood];
      if (currentCategory === 'all') return quotes;
      return quotes.filter(q => q.category === currentCategory);
    }

    // Generate random quote
    function generateQuote() {
      if (isAnimating) return;
      isAnimating = true;

      const filtered = getFilteredQuotes();
      if (filtered.length === 0) return;

      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * filtered.length);
      } while (randomIndex === lastQuoteIndex && filtered.length > 1);
      lastQuoteIndex = randomIndex;

      const quote = filtered[randomIndex];
      quoteCount++;

      // Blur out
      quoteText.classList.add('blur-out');
      quoteAuthor.classList.add('blur-out');

      // Create particles
      createParticles();

      setTimeout(() => {
        // Update content
        quoteText.textContent = quote.text;
        quoteAuthor.innerHTML = `<span class="author-dash"></span>${quote.author}`;

        // Remove blur-out, add blur-in
        quoteText.classList.remove('blur-out');
        quoteAuthor.classList.remove('blur-out');
        quoteText.classList.add('blur-in');
        quoteAuthor.classList.add('blur-in');

        // Update counter
        const totalQuotes = quotesByMood[currentMood].length;
        counter.textContent = `${quoteCount} / ${totalQuotes}`;

        // Trigger reflow and remove blur-in
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            quoteText.classList.remove('blur-in');
            quoteAuthor.classList.remove('blur-in');
            isAnimating = false;
          });
        });
      }, 500);
    }

    // Create particle burst effect
    function createParticles() {
      const card = document.getElementById('quoteCard');
      const rect = card.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      for (let i = 0; i < 8; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const angle = (Math.PI * 2 * i) / 8 + (Math.random() * 0.5 - 0.25);
        const distance = 60 + Math.random() * 100;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        particle.style.left = centerX + 'px';
        particle.style.top = centerY + 'px';
        particle.style.setProperty('--tx', tx + 'px');
        particle.style.setProperty('--ty', ty + 'px');
        particle.style.width = (2 + Math.random() * 3) + 'px';
        particle.style.height = particle.style.width;
        particlesContainer.appendChild(particle);

        setTimeout(() => particle.remove(), 1200);
      }
    }

    // Ripple effect on button
    function createRipple(e) {
      const btn = e.currentTarget;
      const rect = btn.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.left = (e.clientX - rect.left) + 'px';
      ripple.style.top = (e.clientY - rect.top) + 'px';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 800);
    }

    // Copy quote
    function copyQuote() {
      const text = `"${quoteText.textContent}" - ${quoteAuthor.textContent.replace('—', '').trim()}`;
      navigator.clipboard.writeText(text).then(() => {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }

    // Change mood
    function changeMood(mood) {
      currentMood = mood;
      lastQuoteIndex = -1;
      quoteCount = 0;
      
      // Update UI
      document.body.classList.remove('mood-bad', 'mood-fire', 'mood-real');
      if (mood !== 'normal') {
        document.body.classList.add(`mood-${mood}`);
      }

      // Update button states
      moodBtns.forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.mood === mood) {
          btn.classList.add('active');
        }
      });

      generateQuote();
    }

    // Event listeners
    generateBtn.addEventListener('click', (e) => {
      createRipple(e);
      generateQuote();
    });

    shareBtn.addEventListener('click', copyQuote);

    // Keyboard shortcut
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        generateQuote();
      }
    });

    // Mood selector
    moodBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        changeMood(btn.dataset.mood);
      });
    });

    // Category filtering
    categoryPills.forEach(pill => {
      pill.addEventListener('click', () => {
        categoryPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentCategory = pill.dataset.category;
        lastQuoteIndex = -1;
        quoteCount = 0;
        generateQuote();
      });
    });

    // Smooth mouse parallax on quote card
    document.addEventListener('mousemove', (e) => {
      const card = document.getElementById('quoteCard');
      const rect = card.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const deltaX = (e.clientX - centerX) / 40;
      const deltaY = (e.clientY - centerY) / 40;
      card.style.transform = `perspective(1000px) rotateY(${deltaX * 0.3}deg) rotateX(${-deltaY * 0.3}deg)`;
    });

    // Initialize counter
    const initialTotal = quotesByMood.normal.length;
    counter.textContent = `1 / ${initialTotal}`;
  </script>
