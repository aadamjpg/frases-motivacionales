<!DOCTYPE html>
<html lang="es" data-mood="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Frases motivacionales según tu estado de ánimo: normal, mood malo, gym o cruda realidad.">
<meta name="theme-color" content="#0a0b0f">
<title>Frases Motivacionales</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0b0f'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='%23f3f1eb' font-family='Georgia,serif'%3E%E2%80%9C%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,440;0,9..144,560;1,9..144,440&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Reset ---------- */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; }

  /* ---------- Design tokens ---------- */
  :root {
    --bg-0: #0a0b0f;
    --ink: #f3f1eb;
    --ink-dim: #8d8f99;
    --ink-faint: #55575f;
    --line: rgba(243, 241, 235, 0.08);
    --dock-track: rgba(243, 241, 235, 0.045);
    --dock-border: rgba(243, 241, 235, 0.08);

    --accent: #6c8cff;
    --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }

  html[data-mood="bad"]  { --accent: #ff5c68; }
  html[data-mood="fire"] { --accent: #ff8a3d; }
  html[data-mood="real"] { --accent: #c77dff; }

  html, body {
    height: 100%;
    background: var(--bg-0);
    color: var(--ink);
    font-family: 'Sora', sans-serif;
    overflow-x: hidden;
  }

  ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }

  /* ---------- App shell ---------- */
  .app {
    position: relative;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    isolation: isolate;
  }

  /* ---------- Ambient aurora background ---------- */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background: var(--bg-0);
  }

  .aurora .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(min(18vw, 140px));
    opacity: 0.55;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 55%, transparent) 0%, transparent 70%);
    transition: background 1.1s var(--ease-out);
    will-change: transform;
  }

  .aurora .blob-a { width: 60vmax; height: 60vmax; top: -22vmax; left: -18vmax; animation: driftA 34s ease-in-out infinite; }
  .aurora .blob-b { width: 50vmax; height: 50vmax; bottom: -20vmax; right: -16vmax; animation: driftB 40s ease-in-out infinite; opacity: 0.4; }
  .aurora .blob-c { width: 38vmax; height: 38vmax; top: 40%; left: 50%; animation: driftC 26s ease-in-out infinite; opacity: 0.3; }

  .aurora::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 40%, transparent 0%, transparent 45%, var(--bg-0) 92%);
  }

  @keyframes driftA {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(6vw, 8vh) scale(1.12); }
  }
  @keyframes driftB {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-5vw, -6vh) scale(1.08); }
  }
  @keyframes driftC {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.2); }
  }

  /* ---------- Topbar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(1.1rem, 3vw, 1.8rem) clamp(1.2rem, 4vw, 2.4rem) 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-size: clamp(0.8rem, 1.6vw, 0.9rem);
    font-weight: 600;
    color: var(--ink-dim);
    letter-spacing: 0.01em;
  }

  .brand .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    transition: background 0.7s var(--ease-out);
    box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 70%, transparent);
  }

  /* ---------- Stage ---------- */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(1.5rem, 6vh, 3rem) clamp(1.2rem, 6vw, 2rem);
    text-align: center;
  }

  .quote-wrap {
    max-width: 44rem;
    width: 100%;
    perspective: 1200px;
  }

  .quote-inner {
    transform: perspective(1200px) rotateX(0) rotateY(0);
    transition: transform 0.4s var(--ease-out);
  }

  .quote-mark {
    display: block;
    font-family: 'Fraunces', serif;
    font-size: clamp(2.5rem, 7vw, 4rem);
    line-height: 1;
    color: color-mix(in srgb, var(--accent) 45%, transparent);
    margin-bottom: clamp(0.25rem, 1vw, 0.5rem);
    transition: color 0.7s var(--ease-out);
    user-select: none;
  }

  .quote-text {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-variation-settings: 'opsz' 40;
    font-weight: 440;
    font-size: clamp(1.5rem, 4.4vw, 2.85rem);
    line-height: 1.22;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-wrap: balance;
    opacity: 1;
    filter: blur(0);
    transform: translateY(0);
    transition: opacity 0.45s var(--ease-out), filter 0.45s var(--ease-out), transform 0.45s var(--ease-out);
  }

  .quote-text.is-out { opacity: 0; filter: blur(14px); transform: translateY(-16px); }
  .quote-text.is-in-start { opacity: 0; filter: blur(14px); transform: translateY(16px); }

  .quote-author {
    margin-top: clamp(1.1rem, 3vw, 1.6rem);
    font-size: clamp(0.8rem, 1.7vw, 0.95rem);
    font-weight: 500;
    color: var(--ink-dim);
    letter-spacing: 0.01em;
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    opacity: 1;
    filter: blur(0);
    transition: opacity 0.45s var(--ease-out) 0.04s, filter 0.45s var(--ease-out) 0.04s;
  }

  .quote-author.is-out,
  .quote-author.is-in-start { opacity: 0; filter: blur(10px); }

  .quote-author .dash {
    width: 18px;
    height: 1px;
    background: var(--ink-faint);
  }

  /* empty state */
  .empty-state {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    color: var(--ink-dim);
    display: none;
  }
  .empty-state.show { display: block; }
  .empty-state span { display: block; margin-top: 0.6rem; font-family: 'Sora', sans-serif; font-size: 0.85rem; color: var(--ink-faint); }

  /* ---------- Actions ---------- */
  .actions {
    margin-top: clamp(1.8rem, 5vw, 2.6rem);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    flex-wrap: wrap;
  }

  .btn {
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.35s var(--ease-spring), box-shadow 0.35s var(--ease-out), border-color 0.35s var(--ease-out), background 0.5s var(--ease-out);
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active { transform: scale(0.96); }

  .btn-primary {
    padding: 0.85rem 1.7rem;
    font-size: clamp(0.85rem, 1.7vw, 0.95rem);
    font-weight: 600;
    border: none;
    background: var(--accent);
    color: var(--bg-0);
    box-shadow: 0 10px 30px -8px color-mix(in srgb, var(--accent) 55%, transparent);
  }

  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 34px -6px color-mix(in srgb, var(--accent) 65%, transparent); }

  .btn-ghost {
    padding: 0.85rem 1.4rem;
    font-size: clamp(0.85rem, 1.7vw, 0.95rem);
    font-weight: 500;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
  }

  .btn-ghost:hover { border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 8%, transparent); }

  .btn svg { width: 17px; height: 17px; flex: none; }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    transform: scale(0);
    animation: ripple 0.7s var(--ease-out) forwards;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(3.4); opacity: 0; } }

  .meta-row {
    margin-top: clamp(1rem, 3vw, 1.4rem);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.75rem;
    color: var(--ink-faint);
  }

  .meta-row kbd {
    display: inline-block;
    padding: 1px 7px;
    border: 1px solid var(--line);
    border-radius: 5px;
    font-family: 'Sora', sans-serif;
    font-size: 0.7rem;
    background: rgba(255, 255, 255, 0.03);
  }

  /* ---------- Particles ---------- */
  .particles { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
    filter: blur(0.5px);
    animation: particle 1s var(--ease-out) forwards;
  }
  @keyframes particle {
    to { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }

  /* ---------- Dock ---------- */
  .dock {
    position: sticky;
    bottom: 0;
    z-index: 4;
    padding: clamp(0.9rem, 3vw, 1.4rem) clamp(1rem, 4vw, 2rem) calc(clamp(0.9rem, 3vw, 1.4rem) + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    background: linear-gradient(to top, var(--bg-0) 40%, transparent);
  }

  .moods {
    position: relative;
    display: inline-flex;
    gap: 0.2rem;
    padding: 0.3rem;
    border-radius: 999px;
    background: var(--dock-track);
    border: 1px solid var(--dock-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    max-width: 100%;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .moods::-webkit-scrollbar { display: none; }

  .mood-indicator {
    position: absolute;
    top: 0.3rem;
    bottom: 0.3rem;
    left: 0.3rem;
    width: 0;
    border-radius: 999px;
    background: var(--accent);
    transition: transform 0.5s var(--ease-spring), width 0.5s var(--ease-spring), background 0.6s var(--ease-out);
    z-index: 0;
  }

  .mood-btn {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 1rem;
    border: none;
    background: transparent;
    border-radius: 999px;
    font-size: clamp(0.72rem, 1.5vw, 0.82rem);
    font-weight: 600;
    color: var(--ink-dim);
    white-space: nowrap;
    cursor: pointer;
    transition: color 0.35s var(--ease-out);
  }

  .mood-btn svg { width: 15px; height: 15px; }
  .mood-btn.active { color: var(--bg-0); }

  .categories {
    display: flex;
    gap: 0.4rem;
    max-width: 100%;
    overflow-x: auto;
    padding: 0.15rem 0.1rem;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to right, transparent 0, black 16px, black calc(100% - 16px), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, black 16px, black calc(100% - 16px), transparent 100%);
  }
  .categories::-webkit-scrollbar { display: none; }

  .cat-pill {
    flex: none;
    padding: 0.42rem 0.85rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-dim);
    font-size: clamp(0.68rem, 1.3vw, 0.75rem);
    font-weight: 500;
    cursor: pointer;
    transition: background 0.35s var(--ease-out), border-color 0.35s var(--ease-out), color 0.35s var(--ease-out);
  }

  .cat-pill.active {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
  }

  .cat-pill:hover:not(.active) { border-color: color-mix(in srgb, var(--ink) 20%, transparent); color: var(--ink); }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: clamp(6rem, 20vh, 8rem);
    transform: translate(-50%, 12px);
    padding: 0.65rem 1.3rem;
    border-radius: 999px;
    background: rgba(243, 241, 235, 0.95);
    color: var(--bg-0);
    font-size: 0.8rem;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s var(--ease-out), transform 0.35s var(--ease-out);
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Accessibility ---------- */
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .aurora .blob { animation: none !important; }
    .quote-text, .quote-author, .quote-inner, .btn, .mood-indicator, .cat-pill, .toast { transition: none !important; }
  }

  @media (hover: none) {
    .quote-inner { transform: none !important; }
  }

  @media (max-width: 420px) {
    .actions { gap: 0.5rem; }
    .btn-primary, .btn-ghost { padding-inline: 1.2rem; }
  }
</style>
</head>
<body>

  <div class="app">
    <div class="aurora" aria-hidden="true">
      <div class="blob blob-a"></div>
      <div class="blob blob-b"></div>
      <div class="blob blob-c"></div>
    </div>

    <div class="particles" id="particles" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand"><span class="dot"></span>Frases</div>
    </header>

    <main class="stage">
      <div class="quote-wrap">
        <div class="quote-inner" id="quoteInner">
          <span class="quote-mark" aria-hidden="true">&ldquo;</span>
          <p class="quote-text" id="quoteText" aria-live="polite">El único modo de hacer un gran trabajo es amar lo que haces.</p>
          <p class="quote-author" id="quoteAuthor"><span class="dash"></span>Steve Jobs</p>
          <div class="empty-state" id="emptyState">
            No hay frases para esta combinación.
            <span>Prueba otro estado de ánimo o categoría.</span>
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="generateBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            Nueva frase
          </button>
          <button class="btn btn-ghost" id="shareBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            Copiar
          </button>
        </div>

        <div class="meta-row">
          <span id="counter">1 de 1</span>
          <span>Pulsa <kbd>Espacio</kbd> para otra frase</span>
        </div>
      </div>
    </main>

    <nav class="dock" aria-label="Filtros">
      <div class="moods" id="moods">
        <div class="mood-indicator" id="moodIndicator"></div>
        <button class="mood-btn active" data-mood="normal" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
          Normal
        </button>
        <button class="mood-btn" data-mood="bad" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a5 5 0 0 1 9.6-2A4 4 0 0 1 17 16H7a4 4 0 0 1-1-8Z"/><path d="M9 19v1M13 19v2"/></svg>
          Mood malo
        </button>
        <button class="mood-btn" data-mood="fire" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 5.5 4 8m15.5-2.5L22 8M8 5.2 6.5 3M16 5.2 17.5 3"/><rect x="6" y="9" width="4" height="4" rx="1"/><rect x="14" y="9" width="4" height="4" rx="1"/><path d="M10 11h4"/></svg>
          Gym
        </button>
        <button class="mood-btn" data-mood="real" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>
          Cruda realidad
        </button>
      </div>

      <div class="categories" id="categories">
        <button class="cat-pill active" data-category="all" type="button">Todas</button>
        <button class="cat-pill" data-category="vida" type="button">Vida</button>
        <button class="cat-pill" data-category="exito" type="button">Éxito</button>
        <button class="cat-pill" data-category="fuerza" type="button">Fuerza</button>
        <button class="cat-pill" data-category="sabiduria" type="button">Sabiduría</button>
        <button class="cat-pill" data-category="creatividad" type="button">Creatividad</button>
        <button class="cat-pill" data-category="personal" type="button">Personal</button>
        <button class="cat-pill" data-category="gym" type="button">Gym</button>
        <button class="cat-pill" data-category="realidad" type="button">Realidad</button>
      </div>
    </nav>

    <div class="toast" id="toast" role="status">Frase copiada</div>
  </div>

<script>
  // ---------- Quotes database ----------
  const quotesByMood = {
    normal: [
      // Vida
      { text: "El unico modo de hacer un gran trabajo es amar lo que haces.", author: "Steve Jobs", category: "vida" },
      { text: "La vida es lo que pasa mientras estas ocupado haciendo otros planes.", author: "John Lennon", category: "vida" },
      { text: "Vive como si fueras a morir manana. Aprende como si fueras a vivir para siempre.", author: "Mahatma Gandhi", category: "vida" },
      { text: "No cuentes los dias, haz que los dias cuenten.", author: "Muhammad Ali", category: "vida" },
      { text: "La vida no se mide por las veces que respiras, sino por los momentos que te dejan sin aliento.", author: "Maya Angelou", category: "vida" },
      { text: "El proposito de la vida es vivirla, saborear la experiencia al maximo.", author: "Eleanor Roosevelt", category: "vida" },
      { text: "La vida es realmente simple, pero insistimos en hacerla complicada.", author: "Confucio", category: "vida" },
      { text: "Al final, no son los anos de tu vida los que cuentan, es la vida en tus anos.", author: "Abraham Lincoln", category: "vida" },
      { text: "Cada dia es una nueva oportunidad para cambiar tu vida.", author: "Paulo Coelho", category: "vida" },
      { text: "La felicidad no es algo hecho. Viene de tus propias acciones.", author: "Dalai Lama", category: "vida" },
      { text: "Sigue tu corazon, pero lleva tu cerebro contigo.", author: "Alfred Adler", category: "vida" },
      { text: "El tiempo es lo mas valioso que un hombre puede gastar.", author: "Teofrasto", category: "vida" },
      { text: "No es la mas fuerte de las especies la que sobrevive, sino la que mejor se adapta al cambio.", author: "Charles Darwin", category: "vida" },

      // Exito
      { text: "El exito es ir de fracaso en fracaso sin perder el entusiasmo.", author: "Winston Churchill", category: "exito" },
      { text: "El exito no es definitivo, el fracaso no es fatal: lo que cuenta es el coraje para continuar.", author: "Winston Churchill", category: "exito" },
      { text: "No he fracasado. He encontrado 10,000 formas que no funcionan.", author: "Thomas Edison", category: "exito" },
      { text: "El exito generalmente llega a quienes estan demasiado ocupados para buscarlo.", author: "Henry David Thoreau", category: "exito" },
      { text: "La unica forma de hacer un gran trabajo es amar lo que haces.", author: "Steve Jobs", category: "exito" },
      { text: "Cree que puedes y ya estas a medio camino.", author: "Theodore Roosevelt", category: "exito" },
      { text: "El secreto del exito es la constancia del proposito.", author: "Benjamin Disraeli", category: "exito" },
      { text: "Tu tiempo es limitado, no lo desperdicies viviendo la vida de alguien mas.", author: "Steve Jobs", category: "exito" },
      { text: "Las grandes cosas nunca vinieron de las zonas de confort.", author: "Neil Armstrong", category: "exito" },
      { text: "Si puedes sonarlo, puedes hacerlo.", author: "Walt Disney", category: "exito" },
      { text: "El unico lugar donde el exito viene antes que el trabajo es en el diccionario.", author: "Vidal Sassoon", category: "exito" },
      { text: "La mejor venganza es un exito masivo.", author: "Frank Sinatra", category: "exito" },
      { text: "Nunca es demasiado tarde para ser lo que podrias haber sido.", author: "George Eliot", category: "exito" },
      { text: "La suerte es lo que pasa cuando la preparacion se encuentra con la oportunidad.", author: "Seneca", category: "exito" },

      // Fuerza

    fire: [
      // Gym y entreno

      { text: "No importa si eres pequeno. Si tu voluntad es grande, eres imbatible.", author: "Anónimo", category: "gym" },

      { text: "La consistencia gana. Siempre. El talento es sobre hielo.", author: "Anónimo", category: "gym" },

    real: [

  // ---------- State ----------
  let currentMood = 'normal';
  let currentCategory = 'all';
  let quoteCount = 0;
  let lastIndex = -1;
  let isAnimating = false;

  // ---------- DOM refs ----------
  const html = document.documentElement;
  const quoteText = document.getElementById('quoteText');
  const quoteAuthor = document.getElementById('quoteAuthor');
  const emptyState = document.getElementById('emptyState');
  const generateBtn = document.getElementById('generateBtn');
  const shareBtn = document.getElementById('shareBtn');
  const counter = document.getElementById('counter');
  const toast = document.getElementById('toast');
  const particles = document.getElementById('particles');
  const moods = document.getElementById('moods');
  const moodIndicator = document.getElementById('moodIndicator');
  const moodBtns = document.querySelectorAll('.mood-btn');
  const catPills = document.querySelectorAll('.cat-pill');
  const quoteInner = document.getElementById('quoteInner');

  // ---------- Helpers ----------
  function getFiltered() {
    const list = quotesByMood[currentMood];
    return currentCategory === 'all' ? list : list.filter(q => q.category === currentCategory);
  }

  function moveIndicator(btn) {
    const wrapRect = moods.getBoundingClientRect();
    const btnRect = btn.getBoundingClientRect();
    moodIndicator.style.width = btnRect.width + 'px';
    moodIndicator.style.transform = `translateX(${btnRect.left - wrapRect.left - 4}px)`;
  }

  function generateQuote() {
    if (isAnimating) return;
    const filtered = getFiltered();

    if (filtered.length === 0) {
      quoteText.style.display = 'none';
      quoteAuthor.style.display = 'none';
      emptyState.classList.add('show');
      counter.textContent = '0 de 0';
      return;
    }

    quoteText.style.display = '';
    quoteAuthor.style.display = '';
    emptyState.classList.remove('show');

    isAnimating = true;
    let idx;
    do { idx = Math.floor(Math.random() * filtered.length); }
    while (idx === lastIndex && filtered.length > 1);
    lastIndex = idx;

    const q = filtered[idx];
    quoteCount++;

    quoteText.classList.add('is-out');
    quoteAuthor.classList.add('is-out');
    burstParticles();

    setTimeout(() => {
      quoteText.textContent = q.text;
      quoteAuthor.innerHTML = `<span class="dash"></span>${q.author}`;

      quoteText.classList.remove('is-out');
      quoteAuthor.classList.remove('is-out');
      quoteText.classList.add('is-in-start');
      quoteAuthor.classList.add('is-in-start');

      counter.textContent = `${quoteCount} de ${quotesByMood[currentMood].length}`;

      requestAnimationFrame(() => requestAnimationFrame(() => {
        quoteText.classList.remove('is-in-start');
        quoteAuthor.classList.remove('is-in-start');
        isAnimating = false;
      }));
    }, 420);
  }

  function burstParticles() {
    const rect = quoteInner.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < 6; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (Math.PI * 2 * i) / 6 + Math.random() * 0.4;
      const dist = 70 + Math.random() * 90;
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      particles.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }
  }

  function ripple(e, el) {
    const rect = el.getBoundingClientRect();
    const r = document.createElement('span');
    r.className = 'ripple';
    const x = (e.clientX ?? rect.left + rect.width / 2) - rect.left;
    const y = (e.clientY ?? rect.top + rect.height / 2) - rect.top;
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    r.style.width = r.style.height = Math.max(rect.width, rect.height) + 'px';
    r.style.marginLeft = r.style.marginTop = -(Math.max(rect.width, rect.height) / 2) + 'px';
    el.appendChild(r);
    setTimeout(() => r.remove(), 700);
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  async function copyQuote() {
    const text = `"${quoteText.textContent}" — ${quoteAuthor.textContent.replace('—', '').trim()}`;
    try {
      await navigator.clipboard.writeText(text);
      showToast('Frase copiada');
    } catch {
      showToast('No se pudo copiar');
    }
  }

  function setMood(mood, btn) {
    currentMood = mood;
    lastIndex = -1;
    quoteCount = 0;
    html.setAttribute('data-mood', mood);

    moodBtns.forEach(b => b.classList.toggle('active', b === btn));
    moveIndicator(btn);
    generateQuote();
  }

  function setCategory(cat, btn) {
    currentCategory = cat;
    lastIndex = -1;
    quoteCount = 0;
    catPills.forEach(p => p.classList.toggle('active', p === btn));
    generateQuote();
  }

  // ---------- Events ----------
  generateBtn.addEventListener('click', (e) => { ripple(e, generateBtn); generateQuote(); });
  shareBtn.addEventListener('click', copyQuote);

  moodBtns.forEach(btn => btn.addEventListener('click', () => setMood(btn.dataset.mood, btn)));
  catPills.forEach(p => p.addEventListener('click', () => setCategory(p.dataset.category, p)));

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && (e.target === document.body)) {
      e.preventDefault();
      generateQuote();
    }
  });

  // Parallax tilt — only on devices with a real hover-capable pointer
  if (window.matchMedia('(hover: hover)').matches && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.addEventListener('mousemove', (e) => {
      const rect = quoteInner.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = (e.clientX - cx) / 60;
      const dy = (e.clientY - cy) / 60;
      quoteInner.style.transform = `perspective(1200px) rotateY(${dx * 0.4}deg) rotateX(${-dy * 0.4}deg)`;
    });
  }

  window.addEventListener('resize', () => {
    const active = document.querySelector('.mood-btn.active');
    if (active) moveIndicator(active);
  });

  // ---------- Init ----------
  function init() {
    const active = document.querySelector('.mood-btn.active');
    moveIndicator(active);
    counter.textContent = `1 de ${quotesByMood.normal.length}`;
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(init);
  } else {
    init();
  }
  window.addEventListener('load', init);
</script>
